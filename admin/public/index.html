<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog Admin</title>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <link id="highlightLight" rel="stylesheet" href="/vendor/highlight-github.min.css">
    <link id="highlightDark" rel="stylesheet" href="/vendor/highlight-github-dark.min.css" disabled>
    <link rel="stylesheet" href="/vendor/katex.min.css">
    <script defer src="/vendor/marked.min.js"></script>
    <script defer src="/vendor/purify.min.js"></script>
    <script defer src="/vendor/highlight.min.js"></script>
    <script defer src="/vendor/katex.min.js"></script>
    <script defer src="/vendor/katex-auto-render.min.js"></script>
    <script defer src="/vendor/lucide.min.js"></script>
    <script defer src="/vendor/diff.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><i data-lucide="notebook-pen"></i></div>
          <div>
            <strong>Throne Blog</strong>
            <span>写作控制台</span>
          </div>
        </div>

        <div class="sidebar-heading">
          <div>
            <strong>文章</strong>
            <span id="postCount">0 篇</span>
          </div>
          <div class="sidebar-actions">
            <button id="loadPostsButton" class="icon-button" type="button" title="刷新文章" aria-label="刷新文章"><i data-lucide="refresh-cw"></i></button>
            <button id="newPostButton" class="icon-button primary-icon-button" type="button" title="新建文章" aria-label="新建文章"><i data-lucide="file-plus-2"></i></button>
          </div>
        </div>

        <div class="list-tools">
          <div class="search-field">
            <i data-lucide="search"></i>
            <input id="postSearchInput" placeholder="搜索标题或文件名" aria-label="搜索文章">
          </div>
          <select id="postSortSelect" title="文章排序" aria-label="文章排序">
            <option value="name-asc">文件名 A-Z</option>
            <option value="name-desc">文件名 Z-A</option>
            <option value="date-desc">日期新到旧</option>
            <option value="date-asc">日期旧到新</option>
          </select>
        </div>

        <div id="postList" class="post-list"></div>

        <details class="settings-panel">
          <summary><span><i data-lucide="settings-2"></i>连接设置</span><i class="settings-chevron" data-lucide="chevron-down"></i></summary>
          <div class="settings-fields">
            <label class="field compact-field">
              <span>Admin Token</span>
              <input id="tokenInput" type="password" autocomplete="current-password">
            </label>
            <button id="saveTokenButton" type="button" class="wide">保存并加载文章</button>
            <label class="field compact-field">
              <span>AI API 地址</span>
              <input id="aiBaseUrlInput" value="https://api.ssstoken.net/v1" spellcheck="false">
            </label>
            <label class="field compact-field">
              <span>AI API Key（仅当前标签页）</span>
              <input id="aiKeyInput" type="password" autocomplete="off">
            </label>
            <label class="field compact-field">
              <span>模型 ID</span>
              <input id="modelInput" value="gpt-5.6-sol" spellcheck="false">
            </label>
            <button id="testAiButton" type="button" class="wide">测试 AI 连接</button>
          </div>
        </details>
      </aside>

      <section class="editor">
        <header class="toolbar">
          <div class="document-heading">
            <div class="document-title-row">
              <strong id="documentTitle">新文章</strong>
              <span id="dirtyStatus" class="state-badge">新草稿</span>
            </div>
            <label class="path-field">
              <i data-lucide="file-text"></i>
              <input id="pathInput" aria-label="文章文件路径" placeholder="source/_posts/new-post.md">
            </label>
          </div>
          <div class="toolbar-actions">
            <select id="modeSelect" title="AI 模式">
              <option value="polish">润色</option>
              <option value="format">整理格式</option>
              <option value="summary">补摘要/分类</option>
              <option value="check">问题检查</option>
            </select>
            <button id="polishButton" type="button"><i data-lucide="sparkles"></i>AI 处理</button>
            <button id="cancelAiButton" type="button" class="danger-button" hidden><i data-lucide="square"></i>取消</button>
            <a class="button-link" href="https://lifexoryoung.cn/" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link"></i>查看网站</a>
            <button id="themeButton" class="icon-button" type="button" title="切换深色主题" aria-label="切换深色主题"><i data-lucide="moon"></i></button>
            <button id="saveButton" type="button"><i data-lucide="cloud-upload"></i>保存并发布</button>
          </div>
        </header>

        <nav class="md-toolbar" aria-label="Markdown tools">
          <div class="tool-group primary-tools">
            <button type="button" data-tool="undo" title="撤销工具栏或 AI 修改" aria-label="撤销"><i data-lucide="undo-2"></i></button>
            <button type="button" data-tool="redo" title="重做工具栏或 AI 修改" aria-label="重做"><i data-lucide="redo-2"></i></button>
            <button type="button" data-tool="h2" title="二级标题" aria-label="二级标题">H2</button>
            <button type="button" data-tool="bold" title="加粗选中文本" aria-label="加粗">B</button>
            <button type="button" data-tool="italic" title="斜体选中文本" aria-label="斜体">I</button>
            <button type="button" data-tool="code" title="插入代码块" aria-label="代码块"><i data-lucide="code-2"></i></button>
            <button type="button" data-tool="link" title="插入 Markdown 链接" aria-label="链接"><i data-lucide="link-2"></i></button>
            <button type="button" data-tool="image" title="上传并插入图片" aria-label="图片"><i data-lucide="image-plus"></i></button>
            <button type="button" data-tool="math-inline" title="插入行内公式" aria-label="行内公式"><i data-lucide="sigma"></i></button>
          </div>
          <details class="more-tools">
            <summary title="更多 Markdown 工具">更多</summary>
            <div class="more-tool-menu">
              <button type="button" data-tool="h3" title="三级标题" aria-label="三级标题">H3</button>
              <button type="button" data-tool="quote" title="引用块" aria-label="引用">引用</button>
              <button type="button" data-tool="ul" title="无序列表" aria-label="无序列表">列表</button>
              <button type="button" data-tool="ol" title="有序列表" aria-label="有序列表">编号</button>
              <button type="button" data-tool="math-block" title="插入 $$...$$ 块级公式" aria-label="块公式">块公式</button>
              <button type="button" data-tool="table" title="插入 Markdown 表格" aria-label="表格">表格</button>
              <button type="button" data-tool="info" title="插入可折叠提示块" aria-label="提示块">提示块</button>
              <button type="button" data-tool="sample" title="插入样例输入/输出代码块" aria-label="样例块">样例块</button>
              <button type="button" data-tool="more" title="插入 Hexo 摘要分隔 <!--more-->" aria-label="摘要分隔">摘要分隔</button>
            </div>
          </details>
          <div class="view-controls">
            <button id="syncScrollButton" type="button" class="toggle-button" aria-pressed="true" title="同步编辑区与预览区滚动"><i data-lucide="link-2"></i><span>同步滚动</span></button>
            <div class="segmented-control" aria-label="工作区视图">
              <button type="button" data-view="source">编辑</button>
              <button type="button" data-view="split" class="active">分栏</button>
              <button type="button" data-view="preview">预览</button>
            </div>
          </div>
        </nav>

        <div class="statusbar">
          <div id="status" class="status" role="status" aria-live="polite">准备就绪</div>
          <div class="status-meta">
            <span id="draftStatus"><i data-lucide="hard-drive"></i>本地草稿待保存</span>
            <div id="publishPipeline" class="publish-pipeline" data-stage="idle" aria-label="发布进度">
              <span data-step="commit" title="提交到 GitHub"><i data-lucide="git-commit-horizontal"></i><b>提交</b></span>
              <span data-step="build" title="Hexo 构建"><i data-lucide="hammer"></i><b>构建</b></span>
              <span data-step="deploy" title="Pages 部署"><i data-lucide="server-cog"></i><b>部署</b></span>
              <span data-step="live" title="网站上线"><i data-lucide="globe-2"></i><b>上线</b></span>
            </div>
            <span id="publishStatus"><i data-lucide="circle-dot"></i>尚未发布</span>
          </div>
          <div id="aiProgress" class="activity-track" hidden><span></span></div>
        </div>

        <section id="reviewPanel" class="review-panel" hidden>
          <div class="review-header">
            <div>
              <strong>AI 修改对比</strong>
              <span id="diffSummary">等待生成</span>
            </div>
            <div class="review-actions">
              <button id="previousChangeButton" class="icon-button" type="button" title="上一处变化" aria-label="上一处变化"><i data-lucide="chevron-up"></i></button>
              <button id="nextChangeButton" class="icon-button" type="button" title="下一处变化" aria-label="下一处变化"><i data-lucide="chevron-down"></i></button>
              <button id="toggleUnchangedButton" type="button" aria-pressed="false">折叠未修改</button>
              <button id="applyAiButton" type="button">应用修改</button>
              <button id="copyAiButton" type="button">复制建议</button>
              <button id="discardAiButton" type="button">丢弃</button>
            </div>
          </div>
          <div class="review-columns">
            <section>
              <div class="review-label">完整差异</div>
              <div id="diffView" class="diff-view" aria-live="polite"></div>
            </section>
          </div>
        </section>

        <div class="workspace">
          <section class="editor-pane">
            <div class="pane-title">
              <span>Markdown 源文</span>
              <span id="editorMeta">0 字</span>
            </div>
            <div id="editorMount" class="source-editor" aria-label="Markdown 源文"></div>
            <input id="imageFileInput" type="file" accept="image/*" hidden>
          </section>
          <div id="workspaceDivider" class="workspace-divider" role="separator" aria-label="调整编辑和预览宽度" aria-orientation="vertical" tabindex="0"></div>
          <section class="preview-pane">
            <div class="pane-title">
              <span>实时预览</span>
              <span>Markdown + LaTeX</span>
            </div>
            <article id="preview" class="preview"></article>
          </section>
        </div>

      </section>
    </main>
    <aside id="errorNotice" class="error-notice" role="alert" hidden>
      <span id="errorNoticeText"></span>
      <button id="closeErrorNotice" type="button" title="关闭错误提示" aria-label="关闭错误提示">×</button>
    </aside>
    <script src="/app.js" type="module"></script>
  </body>
</html>
